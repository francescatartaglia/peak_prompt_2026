<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lagazuoi Hike — HR Map</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Sora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <aside class="panel" id="panel">
        <header class="panel-head">
          <p class="brand">Peak Prompt 2026</p>
          <h1 id="title">Hike map</h1>
          <p class="lede">Heart-rate zones on the Wikiloc track · media synced by time</p>
        </header>

        <section class="stats" id="stats"></section>

        <section class="zones" id="zones"></section>

        <section class="filters">
          <p class="section-label">Media layers</p>
          <div class="filter-row" role="group" aria-label="Media filters">
            <button type="button" class="filter is-active" data-kind="all">All</button>
            <button type="button" class="filter" data-kind="image">Photos</button>
            <button type="button" class="filter" data-kind="video">Video</button>
            <button type="button" class="filter" data-kind="audio">Audio</button>
          </div>
        </section>

        <section class="inspector" id="inspector" hidden>
          <div class="inspector-media" id="inspector-media"></div>
          <div class="inspector-copy">
            <p class="eyebrow" id="inspector-kind"></p>
            <h2 id="inspector-title"></h2>
            <p id="inspector-meta"></p>
            <p id="inspector-hr"></p>
            <button type="button" class="ghost" id="inspector-close">Close</button>
          </div>
        </section>
      </aside>

      <main class="stage">
        <div id="map" aria-label="Hike map"></div>
        <div class="chart-card">
          <div class="chart-head">
            <div>
              <p class="section-label">Heart rate & elevation</p>
              <p class="chart-hint" id="chart-hint">Hover the chart to scrub the route</p>
            </div>
            <div class="chart-readout" id="chart-readout">—</div>
          </div>
          <div class="chart-wrap">
            <canvas id="profileChart"></canvas>
          </div>
        </div>
      </main>
    </div>

    <div id="loader" class="loader">
      <div>
        <p class="brand">Peak Prompt 2026</p>
        <h2>Loading hike data…</h2>
      </div>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
    <script src="app.js" type="module"></script>
  </body>
</html>
